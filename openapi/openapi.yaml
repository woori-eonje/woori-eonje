openapi: 3.1.0

info:
  title: 우리 언제? API
  version: 0.1.0
  description: |
    기간 기반 모임 시간 조율 서비스 "우리 언제?"의 API 계약(단일 출처, SSOT).

    설계-퍼스트로 이 명세를 먼저 합의하고, 프론트엔드는 여기서 타입을 생성하며
    백엔드(NestJS)는 이 명세에 맞춰 구현한다.

    - 도메인 규칙: docs/domain.md / plan/whenwe_plan_v0.3.pdf
    - 모든 응답은 `{ success, data, error }` 봉투로 감싼다 (@whenwe/types 의 ApiResponse 와 일치).
    - 인증: 모임장 = JWT Bearer, 참여자 응답 수정 = X-Participant-Edit-Token 헤더,
      초대 접근 = inviteToken 경로 파라미터.
    - 날짜·시간은 ISO 8601(date-time 은 타임존 오프셋 포함, 예: +09:00).

servers:
  - url: http://localhost:3001
    description: 로컬 개발

tags:
  - name: Auth
    description: 회원 인증
  - name: Meetings
    description: 모임 생성/조회/확정 (모임장)
  - name: Invites
    description: 초대 링크 기반 비회원 참여
  - name: Availability
    description: 참여자 가능 시간 제출/조회
  - name: Recommendations
    description: 추천 결과
  - name: Calendar
    description: 캘린더 내보내기

paths:
  # ──────────────── Auth ────────────────
  /api/auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthUser' }
        '409':
          $ref: '#/components/responses/Error'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로그인 (JWT 발급)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Empty' }
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 현재 로그인 사용자 조회
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Error'

  # ──────────────── Meetings ────────────────
  /api/meetings:
    post:
      tags: [Meetings]
      operationId: createMeeting
      summary: 모임 생성
      description: 생성 시 시간 슬롯과 invite_token 이 함께 생성되고 상태는 COLLECTING 이 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMeetingRequest' }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MeetingCreated' }
        '401':
          $ref: '#/components/responses/Error'
    get:
      tags: [Meetings]
      operationId: listMyMeetings
      summary: 내 모임 목록 (추가 — 내 모임 목록 화면)
      responses:
        '200':
          description: 모임 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MeetingSummary' }
        '401':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      operationId: getMeeting
      summary: 모임 상세 (모임장)
      responses:
        '200':
          description: 모임 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MeetingDetail' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [Meetings]
      operationId: updateMeeting
      summary: 모임 수정 (모임장)
      description: |
        수집 중(COLLECTING)이고 응답자가 한 명도 없을 때만 수정할 수 있다.
        응답자가 있으면 409 RESPONSE_ALREADY_EXISTS, 수집 중이 아니면(마감 경과로
        READY_TO_CONFIRM 전환·확정·마감) 409 MEETING_NOT_EDITABLE.
        생성과 동일 필드를 전체 교체하며, 날짜/시간/소요 변경에 따라 시간 슬롯이 재생성된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMeetingRequest' }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MeetingDetail' }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Meetings]
      operationId: deleteMeeting
      summary: 모임 삭제 (모임장)
      description: |
        모임장이 언제든(상태 무관) 모임을 삭제한다. 참여자·슬롯·가능시간·추천결과·
        상태로그는 스키마의 onDelete Cascade 로 함께 삭제된다.
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Empty' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/participants:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      operationId: listParticipants
      summary: 참여자 목록 (모임장 — 필수참석자 지정 화면)
      responses:
        '200':
          description: 참여자 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          participants:
                            type: array
                            items: { $ref: '#/components/schemas/ParticipantWithStatus' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/aggregate:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Meetings]
      operationId: getAggregate
      summary: 응답 현황 히트맵 집계 (모임장)
      description: |
        슬롯별 가능/애매/불가 응답 수를 집계해 반환한다(대시보드 히트맵).
        추천 엔진의 window 단위 집계와 달리 개별 1시간 슬롯 단위 카운트다.
        응답이 없는 슬롯도 카운트 0 으로 모두 포함한다(히트맵 격자 채우기).
      responses:
        '200':
          description: 슬롯별 집계
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          meetingId: { type: integer }
                          slots:
                            type: array
                            items: { $ref: '#/components/schemas/SlotAggregate' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/participants/{participantId}:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
      - name: participantId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Meetings]
      operationId: setParticipantRequired
      summary: 필수 참석자 지정/해제 (추가 — 추천 결과 화면)
      description: is_required 변경 시 추천 결과를 재계산한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isRequired]
              properties:
                isRequired: { type: boolean }
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Participant' }
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/confirm:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    post:
      tags: [Meetings]
      operationId: confirmMeeting
      summary: 일정 확정 (모임장)
      description: 추천 결과 중 하나를 골라 확정한다. 이미 확정된 모임은 거부된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendationId]
              properties:
                recommendationId: { type: integer }
      responses:
        '200':
          description: 확정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfirmResult' }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  # ──────────────── Invites (비회원) ────────────────
  /api/invites/{inviteToken}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      tags: [Invites]
      operationId: getInvite
      summary: 초대 링크로 모임 공개 정보 조회
      security: []
      responses:
        '200':
          description: 모임 공개 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InvitePublic' }
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'

  /api/invites/{inviteToken}/participants:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      tags: [Invites]
      operationId: registerParticipant
      summary: 비회원 참여자 등록 (edit token 발급)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestName]
              properties:
                guestName: { type: string, minLength: 2, maxLength: 12 }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ParticipantRegistered' }
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'

  # ──────────────── Slots & Availability ────────────────
  /api/meetings/{meetingId}/slots:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Availability]
      operationId: listSlots
      summary: 시간 슬롯 목록 조회
      security: []
      responses:
        '200':
          description: 슬롯 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          meetingId: { type: integer }
                          durationHours: { type: integer }
                          slots:
                            type: array
                            items: { $ref: '#/components/schemas/Slot' }
                          windows:
                            type: array
                            items: { $ref: '#/components/schemas/SlotWindow' }
        '404':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/availability:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    post:
      tags: [Availability]
      operationId: submitAvailability
      summary: 가능 시간 제출/수정
      description: |
        참여자가 슬롯별 가능/애매/불가를 제출한다. 같은 슬롯 재제출은 update.
        제출 후 추천 결과가 재계산된다. 응답 마감 이후에는 거부된다.
      security:
        - participantToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAvailabilityRequest' }
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          saved: { type: boolean }
                          updatedRecommendation: { type: boolean }
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/meetings/{meetingId}/availability/me:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Availability]
      operationId: getMyAvailability
      summary: 내 응답 조회
      security:
        - participantToken: []
      responses:
        '200':
          description: 내 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MyAvailability' }
        '401':
          $ref: '#/components/responses/Error'

  # ──────────────── Recommendations ────────────────
  /api/meetings/{meetingId}/recommendations:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Recommendations]
      operationId: getRecommendations
      summary: 추천 결과 조회 (TOP 5)
      description: 계산은 응답 제출 시 수행되며, 이 API 는 저장된 결과만 반환한다.
      responses:
        '200':
          description: 추천 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          meetingId: { type: integer }
                          recommendations:
                            type: array
                            items: { $ref: '#/components/schemas/Recommendation' }
        '404':
          $ref: '#/components/responses/Error'

  # ──────────────── Calendar ────────────────
  /api/meetings/{meetingId}/calendar.ics:
    parameters:
      - $ref: '#/components/parameters/MeetingId'
    get:
      tags: [Calendar]
      operationId: downloadCalendar
      summary: 확정 일정 .ics 다운로드
      description: 확정된 모임의 iCalendar 파일을 반환한다. (봉투로 감싸지 않는 텍스트 응답)
      responses:
        '200':
          description: iCalendar 파일
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 모임장(로그인 사용자) 인증
    participantToken:
      type: apiKey
      in: header
      name: X-Participant-Edit-Token
      description: 비회원 참여자의 응답 수정 토큰

  parameters:
    MeetingId:
      name: meetingId
      in: path
      required: true
      schema: { type: integer }
    InviteToken:
      name: inviteToken
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: 에러 (공통 봉투)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ── 봉투 ──
    ApiSuccess:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        error: { type: 'null' }
        data: {}
    ErrorResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ApiError' }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
    Empty:
      type: object
      additionalProperties: false

    # ── enums (값은 @whenwe/types 와 일치) ──
    MeetingStatus:
      type: string
      enum: [DRAFT, COLLECTING, READY_TO_CONFIRM, CONFIRMED, CLOSED]
    MeetingCategory:
      type: string
      enum: [FRIEND, STUDY, BUSINESS]
    AvailabilityStatus:
      type: string
      enum: [AVAILABLE, MAYBE, UNAVAILABLE]
    ParticipantType:
      type: string
      enum: [MEMBER, GUEST]
    ErrorCode:
      type: string
      enum:
        - MEETING_NOT_FOUND
        - INVITE_TOKEN_INVALID
        - INVITE_TOKEN_EXPIRED
        - RESPONSE_DEADLINE_PASSED
        - MEETING_ALREADY_CONFIRMED
        - RESPONSE_ALREADY_EXISTS
        - MEETING_NOT_EDITABLE
        - PARTICIPANT_EDIT_TOKEN_INVALID
        - FORBIDDEN_MEETING_OWNER_ONLY
        - RECOMMENDATION_NOT_READY
        - MEETING_NOT_CONFIRMED
        - EMAIL_ALREADY_EXISTS
        - INVALID_CREDENTIALS
        - UNAUTHENTICATED
        - VALIDATION_ERROR
        - INTERNAL_ERROR

    # ── Auth ──
    SignupRequest:
      type: object
      required: [email, password, nickname]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        nickname: { type: string, minLength: 1, maxLength: 30 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        nickname: { type: string }
    LoginResult:
      type: object
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/AuthUser' }

    # ── Meetings ──
    CreateMeetingRequest:
      type: object
      required: [title, category, startDate, endDate, availableStartTime, availableEndTime, durationHours, responseDeadline]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        category: { $ref: '#/components/schemas/MeetingCategory' }
        startDate: { type: string, format: date, description: '조율 시작일 (기간은 최대 14일)' }
        endDate: { type: string, format: date }
        availableStartTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'HH:mm (1시간 슬롯 단위라 정시만 — 분=00)' }
        availableEndTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'HH:mm (1시간 슬롯 단위라 정시만 — 분=00)' }
        durationHours: { type: integer, minimum: 1, maximum: 12 }
        responseDeadline: { type: string, format: date-time }
        dates:
          type: array
          items: { type: string, format: date }
          description: '선택: 범위(startDate~endDate) 내 특정 날짜들만 슬롯 생성. 없으면 전체 범위. 각 날짜는 범위 안, 중복 불가.'
      example:
        title: 6월 전시 모임
        description: 6월 초에 전시 보러 갈 사람들 일정 조율
        category: FRIEND
        startDate: '2026-06-01'
        endDate: '2026-06-14'
        availableStartTime: '18:00'
        availableEndTime: '23:00'
        durationHours: 2
        responseDeadline: '2026-05-30T23:59:00+09:00'
    MeetingCreated:
      type: object
      properties:
        meetingId: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        inviteUrl: { type: string, format: uri }
    MeetingSummary:
      type: object
      properties:
        meetingId: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        category: { $ref: '#/components/schemas/MeetingCategory' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        responseDeadline: { type: string, format: date-time }
        participantCount: { type: integer }    # 전체 참여자 수
        respondedCount: { type: integer }       # 응답을 제출한 distinct 참여자 수(상태 무관, '가능' 수 아님)
    MeetingDetail:
      allOf:
        - $ref: '#/components/schemas/MeetingSummary'
        - type: object
          properties:
            description: { type: [string, 'null'] }
            availableStartTime: { type: string }
            availableEndTime: { type: string }
            durationHours: { type: integer }
            inviteUrl: { type: string, format: uri }
            confirmedStartAt: { type: [string, 'null'], format: date-time }
            confirmedEndAt: { type: [string, 'null'], format: date-time }
    ConfirmResult:
      type: object
      properties:
        meetingId: { type: integer }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        confirmedStartAt: { type: string, format: date-time }
        confirmedEndAt: { type: string, format: date-time }

    # ── Invites / Participants ──
    InvitePublic:
      type: object
      properties:
        meetingId: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/MeetingCategory' }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        durationHours: { type: integer }
        availableStartTime: { type: string, description: 'HH:mm' }
        availableEndTime: { type: string, description: 'HH:mm' }
        responseDeadline: { type: string, format: date-time }
        confirmedStartAt: { type: [string, 'null'], format: date-time }   # CONFIRMED 일 때만 채워짐
        confirmedEndAt: { type: [string, 'null'], format: date-time }
    ParticipantRegistered:
      type: object
      properties:
        participantId: { type: integer }
        guestName: { type: string }
        participantEditToken: { type: string }
    Participant:
      type: object
      properties:
        participantId: { type: integer }
        guestName: { type: string }
        participantType: { $ref: '#/components/schemas/ParticipantType' }
        isRequired: { type: boolean }
    ParticipantWithStatus:
      allOf:
        - $ref: '#/components/schemas/Participant'
        - type: object
          properties:
            hasResponded: { type: boolean }   # 가능시간을 1개라도 제출했는지

    # ── Slots / Availability ──
    Slot:
      type: object
      properties:
        slotId: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    SlotWindow:
      type: object
      required: [startAt, endAt, slotIds]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        slotIds:
          type: array
          items: { type: integer }
          description: '블록을 구성하는 연속 1시간 슬롯 id들(길이 = durationHours)'
    SlotAggregate:
      type: object
      required: [slotId, startAt, availableCount, maybeCount, unavailableCount]
      properties:
        slotId: { type: integer }
        startAt: { type: string, format: date-time }
        availableCount: { type: integer }    # 이 슬롯에 '가능'을 찍은 참여자 수
        maybeCount: { type: integer }        # '애매'
        unavailableCount: { type: integer }  # '불가'
    AvailabilityItem:
      type: object
      required: [slotId, status]
      properties:
        slotId: { type: integer }
        status: { $ref: '#/components/schemas/AvailabilityStatus' }
    SubmitAvailabilityRequest:
      type: object
      required: [participantId, items]
      properties:
        participantId: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }
    MyAvailability:
      type: object
      properties:
        participantId: { type: integer }
        guestName: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/AvailabilityItem' }

    # ── Recommendations ──
    Recommendation:
      type: object
      properties:
        recommendationId: { type: integer, description: 'recommendation_results 행 id (confirm 요청에 사용). 재계산 시 바뀌므로 조회 직후의 값만 유효' }
        rank: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        availableCount: { type: integer }
        maybeCount: { type: integer }
        unavailableCount: { type: integer }
        requiredAvailableCount: { type: integer }
        requiredMaybeCount: { type: integer }
        requiredUnavailableCount: { type: integer }
        requiredParticipantSatisfied: { type: boolean }
        score: { type: integer }

# 전역 기본 보안: JWT Bearer (각 비회원/공개 엔드포인트에서 security 로 override)
security:
  - bearerAuth: []
