<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:170px}</style>
</head>
<body>
<div class="card">

<div class="row" style="gap:12px">
  <div class="swatch light" style="background:#F6F8FA;border-color:#E5E7EB"><div class="name">Background</div><div class="hex">#F6F8FA</div></div>
  <div class="swatch light" style="background:#FFFFFF;border-color:#E5E7EB"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div>
  <div class="swatch light" style="background:#FFFFFF;border:1px solid #E5E7EB"><div class="name">Line</div><div class="hex">#E5E7EB</div></div>
  <div class="swatch" style="background:#333333"><div class="name">Text</div><div class="hex">#333333</div></div>
  <div class="swatch" style="background:#6B7280"><div class="name">Text 2</div><div class="hex">#6B7280</div></div>
  <div class="swatch" style="background:#9CA3AF"><div class="name">Muted</div><div class="hex">#9CA3AF</div></div>
</div>
<div class="meta">Cool-grey base. Never beige / cream.</div>

</div>
</body>
</html>
