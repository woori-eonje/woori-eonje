<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:140px}
.btn{height:48px;padding:0 22px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:#1A9562;color:#fff;border-color:#1A9562}
.btn.primary:hover{background:#14784F;border-color:#14784F}
.btn.secondary{background:#EAF7F1;color:#1A9562}
.btn.outline{background:#fff;color:#1A9562;border-color:#1A9562}
.btn.ghost{background:transparent;color:#333}
.btn.danger{background:#fff;color:#EF4444;border-color:#FCA5A5}
.btn.disabled{background:#F3F4F6;color:#9CA3AF;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">

<div class="row" style="gap:10px;flex-wrap:wrap">
  <button class="btn primary" style="background:#1A9562">default</button>
  <button class="btn primary" style="background:#14784F">hover</button>
  <button class="btn primary" style="background:#0F5E3E;transform:scale(.97)">press</button>
  <button class="btn primary" style="box-shadow:0 0 0 4px rgba(26,149,98,0.25)">focus</button>
  <button class="btn primary" style="background:#1A9562;opacity:1;display:inline-flex;align-items:center;gap:8px">
    <span style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:s 0.8s linear infinite"></span> 제출 중
  </button>
  <button class="btn disabled">disabled</button>
</div>
<style>@keyframes s{to{transform:rotate(360deg)}}</style>
<div class="meta">Primary button states · default · hover · press (scale .97) · focus (4px ring) · loading · disabled</div>

</div>
</body>
</html>
