<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:140px}</style>
</head>
<body>
<div class="card">

<div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:12px">
  <div style="background:#EAF7F1;border:1px solid #1A9562;border-radius:14px;padding:14px;display:flex;align-items:center;gap:8px;color:#1A9562;font-weight:700">
    <span style="display:inline-block;width:14px;height:14px;border:2px solid #1A9562;border-radius:50%"></span> 가능 #1A9562
  </div>
  <div style="background:#FFF7E8;border:1px solid #F5AB54;border-radius:14px;padding:14px;display:flex;align-items:center;gap:8px;color:#B66A00;font-weight:700">
    <span style="display:inline-block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid #F5AB54"></span> 애매 #F5AB54
  </div>
  <div style="background:#F3F4F6;border:1px solid #D1D5DB;border-radius:14px;padding:14px;display:flex;align-items:center;gap:8px;color:#9CA3AF;font-weight:700">
    <span style="display:inline-block;width:14px;height:2px;background:#9CA3AF"></span> 불가 #D1D5DB
  </div>
</div>
<div class="meta">Status = color + label + shape. Color alone is never sufficient.</div>

</div>
</body>
</html>
