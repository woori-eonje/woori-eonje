<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:200px}</style>
</head>
<body>
<div class="card">

<style>
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,#F3F4F6 0%,#E5E7EB 50%,#F3F4F6 100%);background-size:800px 100%;animation:shimmer 1.4s linear infinite;border-radius:8px}
</style>
<div style="display:flex;flex-direction:column;gap:10px">
  <div class="sk" style="height:18px;width:60%"></div>
  <div class="sk" style="height:14px;width:40%"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px">
    <div class="sk" style="height:56px;border-radius:14px"></div>
    <div class="sk" style="height:56px;border-radius:14px"></div>
    <div class="sk" style="height:56px;border-radius:14px"></div>
  </div>
</div>
<div class="meta">Skeleton loader — shimmer on grey, same shape as the slots/cards it replaces.</div>

</div>
</body>
</html>
