<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:240px}</style>
</head>
<body>
<div class="card">

<style>
.es{background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.es .blob{width:80px;height:60px;position:relative}
</style>
<div class="es">
  <svg width="92" height="64" viewBox="0 0 92 64">
    <path d="M10 60 Q10 30 40 30 Q70 30 70 60" fill="#D6E7FF"/>
    <ellipse cx="78" cy="52" rx="10" ry="9" fill="#E6DBF7"/>
    <circle cx="76" cy="50" r="1.5" fill="#333"/>
    <circle cx="81" cy="50" r="1.5" fill="#333"/>
    <path d="M76 53 Q78.5 55 81 53" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <div style="font-size:16px;font-weight:800;letter-spacing:-0.025em">아직 응답한 사람이 없어요</div>
  <div style="font-size:13px;color:#6B7280;letter-spacing:-0.015em">초대 링크를 한 번 더 보내볼까요?</div>
  <button style="margin-top:6px;height:40px;padding:0 18px;border:1px solid #1A9562;border-radius:12px;background:#fff;color:#1A9562;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:-0.015em;cursor:pointer">링크 복사</button>
</div>

</div>
</body>
</html>
