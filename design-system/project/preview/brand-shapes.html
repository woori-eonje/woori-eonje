<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:200px}</style>
</head>
<body>
<div class="card">

<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-start">
  <!-- Forest half-dome with smile (mascot-ish) -->
  <svg width="64" height="48" viewBox="0 0 64 48"><path d="M0 48 Q0 0 32 0 Q64 0 64 48 Z" fill="#1A9562"/><circle cx="24" cy="22" r="2" fill="#fff"/><circle cx="40" cy="22" r="2" fill="#fff"/><path d="M24 30 Q32 36 40 30" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  <!-- Lavender scalloped cloud with smile -->
  <svg width="76" height="62" viewBox="0 0 76 62"><g fill="#E6DBF7"><circle cx="14" cy="36" r="14"/><circle cx="30" cy="20" r="14"/><circle cx="48" cy="18" r="16"/><circle cx="62" cy="36" r="14"/><circle cx="38" cy="46" r="16"/></g><circle cx="32" cy="32" r="2" fill="#333"/><circle cx="46" cy="32" r="2" fill="#333"/><path d="M32 40 Q39 46 46 40" stroke="#333" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
  <!-- Baby Blue rainbow -->
  <svg width="80" height="44" viewBox="0 0 80 44"><path d="M0 44 Q0 0 40 0 Q80 0 80 44 L62 44 Q62 18 40 18 Q18 18 18 44 Z" fill="#D6E7FF"/></svg>
  <!-- Forest arch -->
  <svg width="40" height="56" viewBox="0 0 40 56"><path d="M0 56 V20 Q0 0 20 0 Q40 0 40 20 V56 Z" fill="#1A9562"/></svg>
  <!-- Baby Blue kidney bean -->
  <svg width="64" height="40" viewBox="0 0 64 40"><path d="M14 4 Q44 -4 56 18 Q60 32 44 36 Q24 40 18 30 Q4 22 14 4 Z" fill="#D6E7FF"/></svg>
  <!-- Lavender cloud arch -->
  <svg width="56" height="36" viewBox="0 0 56 36"><path d="M0 36 Q0 0 28 0 Q56 0 56 36 Z" fill="#E6DBF7"/></svg>
  <!-- Poppy spark -->
  <svg width="36" height="36" viewBox="0 0 36 36"><path d="M18 0 L20 14 L34 16 L20 18 L18 36 L16 18 L2 16 L16 14 Z" fill="#FF6B6B"/></svg>
  <!-- Dot grid -->
  <svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="10" cy="10" r="2.5" fill="#D6E7FF"/><circle cx="22" cy="10" r="2.5" fill="#D6E7FF"/><circle cx="34" cy="10" r="2.5" fill="#D6E7FF"/><circle cx="46" cy="10" r="2.5" fill="#D6E7FF"/><circle cx="10" cy="22" r="2.5" fill="#D6E7FF"/><circle cx="22" cy="22" r="2.5" fill="#D6E7FF"/><circle cx="34" cy="22" r="2.5" fill="#D6E7FF"/><circle cx="46" cy="22" r="2.5" fill="#D6E7FF"/><circle cx="10" cy="34" r="2.5" fill="#D6E7FF"/><circle cx="22" cy="34" r="2.5" fill="#D6E7FF"/><circle cx="34" cy="34" r="2.5" fill="#D6E7FF"/><circle cx="46" cy="34" r="2.5" fill="#D6E7FF"/><circle cx="10" cy="46" r="2.5" fill="#D6E7FF"/><circle cx="22" cy="46" r="2.5" fill="#D6E7FF"/><circle cx="34" cy="46" r="2.5" fill="#D6E7FF"/><circle cx="46" cy="46" r="2.5" fill="#D6E7FF"/>
  </svg>
  <!-- Forest dot -->
  <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#1A9562"/></svg>
</div>
<div class="meta">Pastel shape kit — half-dome, scalloped cloud, rainbow, arch, kidney, cloud, Poppy spark, dot grid. Use 1–3 per composition, parked at edges, never as fill.</div>

</div>
</body>
</html>
