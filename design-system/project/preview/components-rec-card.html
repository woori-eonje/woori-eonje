<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:270px}</style>
</head>
<body>
<div class="card">

<style>
.rc{background:#fff;border:2px solid rgba(26,149,98,0.3);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative}
.rc .rank{position:absolute;top:-12px;left:20px;background:#1A9562;color:#fff;font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;letter-spacing:-0.01em}
.rc h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.035em}
.rc .meta-row{display:flex;gap:14px;font-size:13px;color:#6B7280;letter-spacing:-0.01em}
.rc .meta-row b{color:#1A9562;font-weight:700}
.rc .req{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#1A9562;background:#EAF7F1;padding:6px 10px;border-radius:8px;align-self:flex-start}
.rc .cta{align-self:stretch;height:48px;border:0;border-radius:14px;background:#1A9562;color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer}
</style>
<div class="rc">
  <span class="rank">1순위</span>
  <h3>6.8 (토) 오후 2:00 – 4:00</h3>
  <div class="meta-row">
    <span>● <b>가능 5명</b></span><span>▲ 애매 1명</span><span>✕ 불가 0명</span>
  </div>
  <span class="req">✓ 필수 참석자 모두 가능</span>
  <button class="cta">이 시간으로 확정</button>
</div>

</div>
</body>
</html>
