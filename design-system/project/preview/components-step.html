<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:150px}</style>
</head>
<body>
<div class="card">

<style>
.step{display:flex;align-items:center;gap:8px}
.step .d{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#F3F4F6;color:#9CA3AF}
.step .d.done{background:#1A9562;color:#fff}
.step .d.cur{background:#fff;color:#1A9562;border:2px solid #1A9562}
.step .line{flex:1;height:2px;background:#E5E7EB;border-radius:2px}
.step .line.done{background:#1A9562}
.step .lbl{font-size:12px;color:#6B7280;font-weight:700}
.step .lbl.cur{color:#1A9562}
</style>
<div style="display:flex;flex-direction:column;gap:10px">
  <div class="step">
    <span class="d done">✓</span><span class="line done"></span>
    <span class="d done">✓</span><span class="line done"></span>
    <span class="d cur">3</span><span class="line"></span>
    <span class="d">4</span><span class="line"></span>
    <span class="d">5</span>
  </div>
  <div class="step" style="gap:6px;padding-left:0">
    <span class="lbl">모임 정보</span><span class="lbl">기간</span><span class="lbl cur">소요 시간</span><span class="lbl">초대</span><span class="lbl">완료</span>
  </div>
</div>
<div class="meta">Wizard step indicator — small, never the focus of the screen.</div>

</div>
</body>
</html>
