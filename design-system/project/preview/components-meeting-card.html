<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:200px}</style>
</head>
<body>
<div class="card">

<style>
.mc{background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.mc .head{display:flex;align-items:center;justify-content:space-between}
.mc h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-0.03em}
.mc .bdg{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#EAF7F1;color:#1A9562}
.mc .desc{font-size:14px;color:#6B7280;letter-spacing:-0.015em;line-height:1.55}
.mc .stats{display:flex;gap:14px;font-size:13px;color:#6B7280;border-top:1px dashed #E5E7EB;padding-top:10px}
.mc .stats b{color:#333;font-weight:700}
</style>
<div class="mc">
  <div class="head">
    <h3>6월 전시 모임</h3>
    <span class="bdg">● 응답 수집 중</span>
  </div>
  <div class="desc">6월 초에 전시 보러 갈 사람들 일정 조율</div>
  <div class="stats">
    <span><b>5/6명</b> 응답</span>
    <span>마감 <b>5.30 (금) 23:59</b></span>
    <span>예상 <b>2시간</b></span>
  </div>
</div>

</div>
</body>
</html>
