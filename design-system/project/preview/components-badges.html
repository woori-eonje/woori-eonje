<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:130px}
.btn{height:48px;padding:0 22px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:#1A9562;color:#fff;border-color:#1A9562}
.btn.primary:hover{background:#14784F;border-color:#14784F}
.btn.secondary{background:#EAF7F1;color:#1A9562}
.btn.outline{background:#fff;color:#1A9562;border-color:#1A9562}
.btn.ghost{background:transparent;color:#333}
.btn.danger{background:#fff;color:#EF4444;border-color:#FCA5A5}
.btn.disabled{background:#F3F4F6;color:#9CA3AF;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">

<style>.bdg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:-0.01em}
.dot{width:6px;height:6px;border-radius:50%}</style>
<div class="row" style="gap:8px;flex-wrap:wrap">
  <span class="bdg" style="background:#EAF7F1;color:#1A9562"><span class="dot" style="background:#1A9562"></span> 응답 수집 중</span>
  <span class="bdg" style="background:#FFF7E8;color:#B66A00"><span class="dot" style="background:#F5AB54"></span> 확정 필요</span>
  <span class="bdg" style="background:#EAF7F1;color:#1A9562">✓ 확정됨</span>
  <span class="bdg" style="background:#F3F4F6;color:#6B7280"><span class="dot" style="background:#9CA3AF"></span> 종료됨</span>
  <span class="bdg" style="background:#FFF0F0;color:#E63A3A">⚠ 마감됨</span>
</div>
<div class="meta">Pill, height 30, 13/800. Show user-language labels — never raw enum names.</div>

</div>
</body>
</html>
