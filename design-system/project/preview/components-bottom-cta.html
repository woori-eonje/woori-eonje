<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:290px}</style>
</head>
<body>
<div class="card">

<style>
.frame{width:340px;height:200px;background:#F6F8FA;border:1px solid #E5E7EB;border-radius:24px;position:relative;overflow:hidden;margin:0 auto}
.frame .content{padding:18px 16px 100px;color:#6B7280;font-size:13px;line-height:1.6}
.frame .footer{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E5E7EB;padding:12px 16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -8px 24px rgba(17,24,39,0.06)}
.frame .summary{font-size:12px;color:#6B7280;display:flex;justify-content:space-between}
.frame .cta{height:48px;border:0;border-radius:14px;background:#1A9562;color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer}
.frame .cta:disabled{background:#F3F4F6;color:#9CA3AF}
</style>
<div class="frame">
  <div class="content">
    날짜별 시간 슬롯이 길게 이어지는 영역.<br/>
    스크롤이 길어져도 제출 버튼은 항상 하단에 떠 있어요.
  </div>
  <div class="footer">
    <div class="summary"><span>선택한 시간 <b style="color:#1A9562">12개</b></span><span>가능 8 · 애매 4</span></div>
    <button class="cta">제출하기</button>
  </div>
</div>
<div class="meta">Bottom-fixed CTA — sticky on mobile, summary above the button so users see what they're submitting.</div>

</div>
</body>
</html>
