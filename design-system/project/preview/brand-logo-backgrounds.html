<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:200px}</style>
</head>
<body>
<div class="card">

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
  <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:14px;height:90px;display:flex;align-items:center;justify-content:center"><img src="../assets/logo.svg" style="height:46px"/></div>
  <div style="background:#F6F8FA;border:1px solid #E5E7EB;border-radius:14px;height:90px;display:flex;align-items:center;justify-content:center"><img src="../assets/logo.svg" style="height:46px"/></div>
  <div style="background:#1A9562;border-radius:14px;height:90px;display:flex;align-items:center;justify-content:center;position:relative">
    <img src="../assets/logo.svg" style="height:46px;filter:brightness(0) invert(1)"/>
    <span style="position:absolute;top:6px;right:8px;font-size:10px;color:rgba(255,255,255,0.6)">avoid</span>
  </div>
</div>
<div class="meta">Use on white or cool light-grey. Don't tint the wordmark or change the "?" color.</div>

</div>
</body>
</html>
