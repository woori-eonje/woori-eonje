<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />

</head>

<div class="card">

<div class="row" style="gap:12px;align-items:center">
  <button style="height:48px;padding:0 22px;border:none;border-radius:14px;background:#1A9562;color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer">이 시간으로 확정</button>

  <button style="height:48px;padding:0 22px;border:1px solid #1A9562;border-radius:14px;background:#fff;color:#1A9562;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer">링크 복사</button>
