<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:150px}</style>
</head>
<body>
<div class="card">

<style>
.chip{height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid #E5E7EB;color:#333;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:-0.015em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip:hover{border-color:#1A9562;color:#1A9562}
.chip.danger{color:#EF4444;border-color:#FCA5A5}
.chip.danger:hover{border-color:#EF4444;color:#EF4444}
</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
  <button class="chip">평일 저녁 가능</button>
  <button class="chip">주말 오후 가능</button>
  <button class="chip danger">전체 초기화</button>
  <button class="chip">선택 지우기</button>
</div>
<div class="meta">Quick-select chips — text-only, 2-column grid. Speed up bulk selection without crowding or cropping the slot grid.</div>

</div>
</body>
</html>
