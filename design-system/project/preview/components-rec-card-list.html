<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:220px}</style>
</head>
<body>
<div class="card">

<style>
.rc2{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.rc2 .rank{font-size:12px;font-weight:800;color:#9CA3AF;width:30px;flex:none}
.rc2 .body{flex:1;min-width:0}
.rc2 .when{font-size:15px;font-weight:700;letter-spacing:-0.02em;margin-bottom:2px}
.rc2 .meta-row{font-size:12px;color:#6B7280}
.rc2 .meta-row b{font-weight:700}
.rc2 .meta-row .ok{color:#1A9562}
.rc2 .meta-row .m{color:#B66A00}
.rc2 .meta-row .x{color:#9CA3AF}
.rc2 .chev{color:#9CA3AF;font-size:18px}
</style>
<div style="display:flex;flex-direction:column;gap:8px">
  <div class="rc2">
    <span class="rank">2순위</span>
    <div class="body">
      <div class="when">6.6 (목) 오후 7:00 – 9:00</div>
      <div class="meta-row"><b class="ok">가능 4</b> · <b class="m">애매 1</b> · <b class="x">불가 1</b> · 필수 1명 애매</div>
    </div>
    <span class="chev">›</span>
  </div>
  <div class="rc2">
    <span class="rank">3순위</span>
    <div class="body">
      <div class="when">6.10 (월) 오후 8:00 – 10:00</div>
      <div class="meta-row"><b class="ok">가능 3</b> · <b class="m">애매 2</b> · <b class="x">불가 0</b> · 필수 모두 가능</div>
    </div>
    <span class="chev">›</span>
  </div>
</div>
<div class="meta">List variant — same vocabulary, lower visual weight than the 1순위 card.</div>

</div>
</body>
</html>
