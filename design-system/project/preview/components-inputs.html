<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:240px}</style>
</head>
<body>
<div class="card">

<style>
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:#333;letter-spacing:-0.015em}
.field label .req{color:#FF6B6B;font-weight:800;margin-left:2px}
.input{height:48px;padding:0 16px;border-radius:14px;border:1px solid #E5E7EB;background:#fff;font-family:inherit;font-size:15px;letter-spacing:-0.02em;color:#333;outline:none}
.input::placeholder{color:#9CA3AF}
.help{font-size:12px;color:#6B7280;letter-spacing:-0.01em}
.err{font-size:12px;color:#EF4444;letter-spacing:-0.01em;display:flex;align-items:center;gap:4px}
</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
  <div class="field">
    <label>닉네임 <span class="req">*</span></label>
    <input class="input" placeholder="닉네임만 입력하면 시작해요"/>
    <div class="help">2~12자, 한글·영문·숫자</div>
  </div>
  <div class="field">
    <label>모임명</label>
    <input class="input" value="6월 전시 모임" style="border-color:#1A9562;box-shadow:0 0 0 4px rgba(26,149,98,0.12)"/>
    <div class="help">focus</div>
  </div>
  <div class="field">
    <label>닉네임</label>
    <input class="input" value="소" style="border-color:#EF4444"/>
    <div class="err">⚠ 2자 이상 입력해주세요</div>
  </div>
  <div class="field">
    <label>이메일</label>
    <input class="input" value="meeting@whenly.app" style="background:#F6F8FA;color:#9CA3AF" disabled/>
    <div class="help">disabled</div>
  </div>
</div>

</div>
</body>
</html>
