<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:200px}</style>
</head>
<body>
<div class="card">

<div style="display:flex;align-items:center;gap:18px">
  <div style="width:96px;height:96px;background:#fff;border-radius:22px;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center"><img src="../assets/favicon.svg" style="width:64px;height:64px"/></div>
  <div style="width:72px;height:72px;background:#fff;border-radius:16px;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center"><img src="../assets/favicon.svg" style="width:48px;height:48px"/></div>
  <div style="width:48px;height:48px;background:#fff;border-radius:12px;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center"><img src="../assets/favicon.svg" style="width:32px;height:32px"/></div>
  <div style="width:32px;height:32px;background:#fff;border-radius:8px;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center"><img src="../assets/favicon.svg" style="width:22px;height:22px"/></div>
  <div style="flex:1">
    <div style="font-size:13px;font-weight:700">Speech bubble + "?"</div>
    <div class="meta">Stays legible from 16 → 128px. The only place the Poppy "?" appears at large size.</div>
  </div>
</div>

</div>
</body>
</html>
