<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:180px}</style>
</head>
<body>
<div class="card">

<div class="row" style="gap:12px">
  <div class="swatch" style="background:#FF6B6B"><div class="name">Poppy</div><div class="hex">#FF6B6B</div></div>
  <div class="swatch" style="background:#FD766F"><div class="name">Poppy (logo)</div><div class="hex">#FD766F</div></div>
  <div class="swatch light" style="background:#FFF0F0"><div class="name">Poppy Soft</div><div class="hex">#FFF0F0</div></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding-left:8px;border-left:1px solid var(--color-line)">
    <div class="label">USE ONLY FOR</div>
    <div style="font-size:13px;color:var(--color-text);line-height:1.5">
      · Logo "?" · Favicon · Required mark<br/>
      · Tiny inline accents (≤16px)<br/>
      <span style="color:#EF4444">✕ Never on CTAs or backgrounds</span>
    </div>
  </div>
</div>

</div>
</body>
</html>
