<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:160px}</style>
</head>
<body>
<div class="card">

<style>
.toggle{display:inline-flex;background:#F3F4F6;padding:4px;border-radius:14px;gap:2px}
.toggle button{height:40px;padding:0 14px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:-0.015em;color:#6B7280;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.toggle button.active.available{background:#1A9562;color:#fff}
.toggle button.active.maybe{background:#F5AB54;color:#fff}
.toggle button.active.unavail{background:#9CA3AF;color:#fff}
</style>
<div>
  <div class="label">현재 선택 모드</div>
  <div class="toggle" style="margin-top:10px">
    <button class="active available">○ 가능</button>
    <button>△ 애매</button>
    <button>✕ 불가</button>
  </div>
</div>
<div class="meta">Mode toggle on the time-select screen. Pick a mode, tap slots to apply it. Each label keeps its icon so blind state-distinction stays possible.</div>

</div>
</body>
</html>
