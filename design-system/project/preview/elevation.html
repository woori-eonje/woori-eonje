<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:200px}</style>
</head>
<body>
<div class="card">

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
  <div style="background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:18px;min-height:90px">
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">기본 카드</div>
    <div class="meta">border + no shadow</div>
  </div>
  <div style="background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:18px;min-height:90px;box-shadow:0 1px 2px rgba(17,24,39,0.04)">
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">shadow-xs</div>
    <div class="meta">0 1px 2px rgba(0,0,0,.04)</div>
  </div>
  <div style="background:#fff;border:1px solid #E5E7EB;border-radius:20px;padding:18px;min-height:90px;box-shadow:0 8px 24px rgba(17,24,39,0.06)">
    <div style="font-size:13px;font-weight:700;margin-bottom:4px">shadow-md</div>
    <div class="meta">bottom-fixed CTA only</div>
  </div>
</div>
<div class="meta">Elevation is built from borders, not shadows. shadow-md is reserved for the floating mobile CTA.</div>

</div>
</body>
</html>
