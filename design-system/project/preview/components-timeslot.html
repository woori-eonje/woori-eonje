<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:280px}
.btn{height:48px;padding:0 22px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-0.015em;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:#1A9562;color:#fff;border-color:#1A9562}
.btn.primary:hover{background:#14784F;border-color:#14784F}
.btn.secondary{background:#EAF7F1;color:#1A9562}
.btn.outline{background:#fff;color:#1A9562;border-color:#1A9562}
.btn.ghost{background:transparent;color:#333}
.btn.danger{background:#fff;color:#EF4444;border-color:#FCA5A5}
.btn.disabled{background:#F3F4F6;color:#9CA3AF;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">

<style>
.slot{min-height:56px;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;letter-spacing:-0.015em;border:1px solid #E5E7EB;background:#fff;color:#333}
.slot .tag{font-size:11px;font-weight:800;letter-spacing:0.02em;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.slot.available{background:#EAF7F1;border-color:#1A9562;color:#1A9562}
.slot.available .tag{background:rgba(26,149,98,0.18);color:#1A9562}
.slot.selected{background:#D6EFE1;border-color:#1A9562;color:#1A9562}
.slot.selected .tag{background:rgba(26,149,98,0.25);color:#1A9562}
.slot.maybe{background:#FFF7E8;border-color:#F5AB54;color:#B66A00}
.slot.maybe .tag{background:rgba(245,171,84,0.22);color:#B66A00}
.slot.unavail{background:#F3F4F6;border-color:#D1D5DB;color:#9CA3AF}
.slot.unavail .tag{background:rgba(156,163,175,0.22);color:#6B7280}
</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <div class="slot">오후 7:00 <span class="tag" style="background:#F3F4F6;color:#6B7280">기본</span></div>
  <div class="slot available">오후 7:30 <span class="tag">○ 가능</span></div>
  <div class="slot selected">오후 8:00 <span class="tag">✓ 선택됨</span></div>
  <div class="slot maybe">오후 8:30 <span class="tag">△ 애매</span></div>
  <div class="slot unavail">오후 9:00 <span class="tag">✕ 불가</span></div>
  <div class="slot" style="opacity:0.5;background:#F3F4F6;color:#9CA3AF;border-color:#E5E7EB"><span style="display:inline-block;width:60px;height:12px;background:#E5E7EB;border-radius:4px"></span> <span style="display:inline-block;width:30px;height:10px;background:#E5E7EB;border-radius:4px"></span></div>
</div>
<div class="meta">Slot states: 기본 / 가능 / 선택됨 / 애매 / 불가 / 로딩. Color + label + icon. 56px min-height (touch).</div>

</div>
</body>
</html>
