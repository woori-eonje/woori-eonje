<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>body{min-height:180px}</style>
</head>
<body>
<div class="card">

<div class="row" style="gap:16px;flex-wrap:wrap">
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:88px">
      <div style="width:72px;height:64px;background:#EAF7F1;border:1px solid #1A9562;border-radius:8px"></div>
      <div style="font-size:12px;font-weight:700">xs · 8</div>
      <div class="meta">tag</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:88px">
      <div style="width:72px;height:64px;background:#EAF7F1;border:1px solid #1A9562;border-radius:12px"></div>
      <div style="font-size:12px;font-weight:700">sm · 12</div>
      <div class="meta">slot</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:88px">
      <div style="width:72px;height:64px;background:#EAF7F1;border:1px solid #1A9562;border-radius:14px"></div>
      <div style="font-size:12px;font-weight:700">md · 14</div>
      <div class="meta">button / input</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:88px">
      <div style="width:72px;height:64px;background:#EAF7F1;border:1px solid #1A9562;border-radius:20px"></div>
      <div style="font-size:12px;font-weight:700">lg · 20</div>
      <div class="meta">card</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:88px">
      <div style="width:72px;height:64px;background:#EAF7F1;border:1px solid #1A9562;border-radius:28px"></div>
      <div style="font-size:12px;font-weight:700">xl · 28</div>
      <div class="meta">panel</div>
    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:88px">
      <div style="width:72px;height:64px;background:#EAF7F1;border:1px solid #1A9562;border-radius:999px"></div>
      <div style="font-size:12px;font-weight:700">pill · 999</div>
      <div class="meta">badge</div>
    </div>
  
</div>

</div>
</body>
</html>
